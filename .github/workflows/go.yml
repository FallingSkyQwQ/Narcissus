# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "feature/linux" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    # Narcissus ships a GTK4 backend for Linux and a WinUI 3 backend for
    # Windows, so CI runs natively on both.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest" ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Install GTK4 development files
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgtk-4-dev

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build narc CLI (Linux)
      if: runner.os == 'Linux'
      run: go build -v -o narc ./cmd/narc

    - name: Build narc CLI (Windows)
      if: runner.os == 'Windows'
      run: go build -v -o narc.exe ./cmd/narc
