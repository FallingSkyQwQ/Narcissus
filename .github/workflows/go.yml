# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "feature/linux" ]
  pull_request:
    branches: [ "main" ]

jobs:

  linux:
    # Narcissus ships a GTK4 backend on Linux. The gotk4 v0.4.x glib bindings
    # call GLib functions added in 2.88 (g_get_monotonic_time_ns, ...), which no
    # stable Ubuntu/Fedora release ships yet, so the job runs in a rolling Arch
    # container to get a matching toolchain.
    name: Linux (GTK4)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        pacman -Syu --noconfirm --needed go pkgconf gtk4 gobject-introspection

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build narc CLI
      run: go build -v -o narc ./cmd/narc

  windows:
    # Narcissus ships a WinUI 3 backend on Windows; it is compile-verified with
    # the Go toolchain only (the bindings need no C toolchain).
    name: Windows (WinUI 3)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Build narc CLI
      run: go build -v -o narc.exe ./cmd/narc
